[package]
name = "aetherion-bridge"
version = "0.2.0"
edition = "2021"
description = "GDExtension bridge for Godot 4 integration"

[dependencies]
aetherion-core = { path = "../core" }
aetherion-parser = { path = "../parser" }
godot = { version = "0.1", optional = true }
gdext = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[lib]
name = "aetherion_bridge"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []
godot-extension = ["godot", "gdext"]

[profile.release]
opt-level = 3
lto = true
