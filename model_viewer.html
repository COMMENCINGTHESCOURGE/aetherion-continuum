<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherion Model Interpreter — glb_mach1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050608; overflow: hidden; font-family: 'Consolas', monospace; color: #0fa; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info {
    position: fixed; top: 16px; left: 16px;
    background: rgba(5,6,8,0.85); padding: 16px;
    border: 1px solid #0fa; font-size: 13px; z-index: 10;
    max-width: 350px; line-height: 1.5;
  }
  .accent { color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div id="info">
  <div style="font-weight:bold;margin-bottom:8px;letter-spacing:0.1em;color:#0ff">MODEL INTERPRETER v1.0</div>
  <div>Model: <span class="accent">glb_mach1.glb</span></div>
  <div>Status: <span id="status" class="accent">Loading...</span></div>
  <div style="margin-top:8px;border-top:1px solid rgba(0,255,170,0.2);padding-top:8px">
    <strong>Interpretation:</strong> Interpreted as the 3D aerodynamic frame of the Mach 1 glider / mecha.
    The geometry maps a swept-wing layout with dual engine nozzles, designed for high-speed atmospheric penetration.
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const statusEl = document.getElementById('status');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050608);
  scene.fog = new THREE.FogExp2(0x050608, 0.015);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 5, 10);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.2);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0x00ffff, 1.5);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const dirLight2 = new THREE.DirectionalLight(0xff00ff, 0.8);
  dirLight2.position.set(-5, 5, -5);
  scene.add(dirLight2);

  const gridHelper = new THREE.GridHelper(20, 20, 0x00ffaa, 0x224433);
  gridHelper.position.y = -1;
  scene.add(gridHelper);

  // Load Model
  const loader = new GLTFLoader();
  loader.load(
    'glb_mach1.glb',
    (gltf) => {
      const model = gltf.scene;
      scene.add(model);
      statusEl.textContent = 'Active (Rendered)';

      // Auto-center and scale
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      
      model.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 4.0 / maxDim;
      model.scale.setScalar(scale);

      // Animate model rotation slightly
      model.rotation.y = 0;
      function tick() {
        requestAnimationFrame(tick);
        model.rotation.y += 0.005;
        controls.update();
        renderer.render(scene, camera);
      }
      tick();
    },
    undefined,
    (err) => {
      console.error(err);
      statusEl.textContent = 'Load Error';
    }
  );

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
