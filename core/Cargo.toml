[package]
name = "aetherion-core"
version = "0.2.0"
edition = "2021"
description = "Core simulation engine with administrative hierarchy"

[dependencies]
aetherion-continuum = { path = ".." }
geo = "0.28"
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
nalgebra = "0.33"

[lib]
name = "aetherion_core"
path = "src/lib.rs"
