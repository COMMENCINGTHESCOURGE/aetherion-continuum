<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHERION-CONTINUUM — Field Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Consolas', 'Courier New', monospace; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px;
    background: rgba(0,0,0,0.7); border: 1px solid #1a3a1a;
    padding: 12px 16px; border-radius: 4px;
    font-size: 12px; line-height: 1.6;
    pointer-events: none; z-index: 10;
  }
  #hud .label { color: #4a4; }
  #hud .value { color: #afa; }
  #console {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 140px; background: rgba(0,0,0,0.88);
    border-top: 1px solid #1a3a1a; padding: 12px;
    font-size: 11px; overflow-y: auto;
    font-family: 'Consolas', monospace;
  }
  #console .ok { color: #4a4; }
  #console .warn { color: #aa4; }
  #console .err { color: #a44; }
  #console .metric { color: #8af; }
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<div id="hud">
  <div><span class="label">AETHERION-CONTINUUM</span> <span class="value">v0.1.0</span></div>
  <div><span class="label">Field Cells:</span> <span class="value" id="cellCount">—</span></div>
  <div><span class="label">Active:</span> <span class="value" id="activeCells">—</span></div>
  <div><span class="label">FPS:</span> <span class="value" id="fps">—</span></div>
  <div><span class="label">Mass Drift:</span> <span class="value" id="massDrift">—</span></div>
  <div><span class="label">Conservation:</span> <span class="value" id="conservation">—</span></div>
  <div><span class="label">Corrections:</span> <span class="value" id="corrections">—</span></div>
  <div><span class="label">GPU Time:</span> <span class="value" id="gpuTime">—</span></div>
</div>
<div id="console"></div>

<script type="module">
const consoleEl = document.getElementById('console');
function log(msg, level = 'ok') {
  const line = document.createElement('div');
  line.className = level;
  line.textContent = `[${new Date().toISOString().slice(11,23)}] ${msg}`;
  consoleEl.appendChild(line);
  consoleEl.scrollTop = consoleEl.scrollHeight;
  if (consoleEl.children.length > 300) consoleEl.removeChild(consoleEl.firstChild);
}

// === HELPERS ===
function pad16(size) { return Math.ceil(size / 16) * 16; }
function align16(offset) { return Math.ceil(offset / 16) * 16; }

// ConservationState layout (WGSL storage: vec3 aligned to 16)
// offset 0:  mass_drift     f32  (4)
// offset 4:  energy_drift   f32  (4)
// offset 8:  [padding]           (8)
// offset 16: momentum_drift vec3 (12)
// offset 28: total_mass     f32  (4)
// offset 32: total_energy   f32  (4)
// total 36 → padded 48
const CONSERVATION_STATE_SIZE = 48;

// DispatchMeta layout (uniform buffer, aligned)
// offset 0:  tile_count        u32 (4)
// offset 4:  cells_per_tile    u32 (4)
// offset 8:  active_mask       u32 (4)
// offset 12: thermal_limit_pct f32 (4)
// offset 16: vram_pressure_pct f32 (4)
// total 20 → padded 32
const DISPATCH_META_SIZE = 32;

const GRID = 64;             // 64³ = 262,144 cells
const TOTAL_CELLS = GRID * GRID * GRID;
const CELLS_PER_TILE = 4096;
const TILE_COUNT = Math.ceil(TOTAL_CELLS / CELLS_PER_TILE);
const FIELD_SIZE = TOTAL_CELLS * 16;     // vec4<f32> per cell
const GRADIENT_SIZE = TOTAL_CELLS * 16;
const PHASE_DIAGRAM_SIZE = 256 * 16;     // 256 bands × vec4
const CORRECTION_LOG_ENTRIES = 1024;
const CORRECTION_LOG_SIZE = CORRECTION_LOG_ENTRIES * 32;

async function init() {
  log('AETHERION-CONTINUUM booting...', 'ok');

  if (!navigator.gpu) {
    log('WebGPU not available — requires Chrome 113+', 'err');
    return;
  }

  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { log('No GPU adapter found', 'err'); return; }

  const device = await adapter.requestDevice({
    requiredFeatures: ['timestamp-query'],
    requiredLimits: {
      maxStorageBufferBindingSize: 1 << 30,
      maxComputeWorkgroupStorageSize: 32768,
      maxComputeWorkgroupsPerDimension: 65535,
    }
  });

  log(`GPU: ${adapter.info.device} | ${adapter.info.vendor}`, 'ok');
    log(`Cells: ${TOTAL_CELLS.toLocaleString()} (${GRID}³) | VRAM: ${((FIELD_SIZE*2+PHASE_DIAGRAM_SIZE+CORRECTION_LOG_SIZE)/1048576).toFixed(1)}MB`, 'ok');
    // === MT3: Buffer size validation ===
    const limits = adapter.limits;
    const fieldVRAM_MB = (FIELD_SIZE + GRADIENT_SIZE + PHASE_DIAGRAM_SIZE + CORRECTION_LOG_SIZE) / 1048576;
    const maxStorage = limits.maxStorageBufferBindingSize;
    if (FIELD_SIZE > maxStorage || GRADIENT_SIZE > maxStorage) {
      log(`FATAL: buffer size ${(FIELD_SIZE/1048576).toFixed(1)}MB exceeds maxStorageBufferBindingSize ${(maxStorage/1048576).toFixed(1)}MB`, 'err');
      return;
    }
    if (FIELD_SIZE + GRADIENT_SIZE > limits.maxBufferSize) {
      log(`WARN: total VRAM ${fieldVRAM_MB.toFixed(1)}MB near limit`, 'warn');
    }
    const maxWG = limits.maxComputeWorkgroupsPerDimension;
    const wgX = Math.ceil(GRID / 8);
    if (wgX > maxWG || GRID > maxWG) {
      log(`FATAL: workgroup dimension ${Math.max(wgX, GRID)} exceeds maxComputeWorkgroupsPerDimension ${maxWG}`, 'err');
      return;
    }
    log(`Buffer validation: ${fieldVRAM_MB.toFixed(1)}MB / ${(maxStorage/1048576).toFixed(0)}MB max | workgroups ${wgX}/${maxWG}`, 'ok');


  // === LOAD SHADERS ===
  const [fieldSrc, conservationSrc, sparseSrc] = await Promise.all([
    fetch('/core/field_tensor.wgsl').then(r => r.text()),
    fetch('/core/conservation_enforce.wgsl').then(r => r.text()),
    fetch('/core/sparse_stream.wgsl').then(r => r.text()),
  ]);
  log('WGSL shaders loaded', 'ok');

  // === ALLOCATE BUFFERS ===
  // Field buffer (vec4 per cell: ρ, φ, ψ, C)
  const fieldBuffer = device.createBuffer({
    size: FIELD_SIZE,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
  });

  // Gradient buffer (vec4 per cell: ∇Tx, ∇Ty, ∇Tz, moisture_flux)
  const gradientBuffer = device.createBuffer({
    size: GRADIENT_SIZE,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
  });

  // Conservation state (read-back target)
  const stateBuffer = device.createBuffer({
    size: CONSERVATION_STATE_SIZE,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
  });

  // Staging buffer for read-back
  const stagingBuffer = device.createBuffer({
    size: CONSERVATION_STATE_SIZE,
    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
  });

  // Dispatch meta uniform
  const metaBuffer = device.createBuffer({
    size: DISPATCH_META_SIZE,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  // Phase diagram (256 bands × vec4: solid_fluid_T, fluid_gas_T, latent_sf, latent_fg)
  const phaseBuffer = device.createBuffer({
    size: PHASE_DIAGRAM_SIZE,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });

  // Correction log
  const correctionLogBuffer = device.createBuffer({
    size: CORRECTION_LOG_SIZE,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
  });

  // Log count (atomic counter)
  const logCountBuffer = device.createBuffer({
    size: 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
  });

  // Cell count uniform
  const cellCountBuffer = device.createBuffer({
    size: 4,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  // === INITIALIZE FIELD DATA ===
  // Fill field: ρ=1.0, φ=random phase, ψ=small entanglement, C=0.8 cohesion
  const fieldInit = new Float32Array(TOTAL_CELLS * 4);
  const gradInit = new Float32Array(TOTAL_CELLS * 4);
  for (let i = 0; i < TOTAL_CELLS; i++) {
    const b = i * 4;
    fieldInit[b]   = 0.8 + Math.random() * 0.4;    // ρ density
    fieldInit[b+1] = Math.random() * 0.3;           // φ phase
    fieldInit[b+2] = Math.random() * 0.05;          // ψ entanglement
    fieldInit[b+3] = 0.5 + Math.random() * 0.5;     // C cohesion
    gradInit[b]   = (Math.random() - 0.5) * 0.02;   // ∇Tx
    gradInit[b+1] = (Math.random() - 0.5) * 0.02;   // ∇Ty
    gradInit[b+2] = (Math.random() - 0.5) * 0.02;   // ∇Tz
    gradInit[b+3] = Math.random() * 0.01;           // moisture flux
  }
  device.queue.writeBuffer(fieldBuffer, 0, fieldInit);
  device.queue.writeBuffer(gradientBuffer, 0, gradInit);

  // Phase diagram: 256 thresholds. Realistic transition temps: solid→fluid ~0.3, fluid→gas ~0.7
  const phaseData = new Float32Array(256 * 4);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    const b = i * 4;
    phaseData[b]   = 0.15 + t * 0.3;     // solid_fluid_T
    phaseData[b+1] = 0.35 + t * 0.5;     // fluid_gas_T
    phaseData[b+2] = 0.05 + t * 0.15;    // latent_sf
    phaseData[b+3] = 0.08 + t * 0.2;     // latent_fg
  }
  device.queue.writeBuffer(phaseBuffer, 0, phaseData);

  // Dispatch meta
  const metaData = new Uint32Array(DISPATCH_META_SIZE / 4);
  metaData[0] = TILE_COUNT;
  metaData[1] = CELLS_PER_TILE;
  metaData[2] = 0xFFFFFFFF;  // active_mask — all active
  new Float32Array(metaData.buffer)[3] = 0.5;   // thermal_limit_pct
  new Float32Array(metaData.buffer)[4] = 0.15;  // vram_pressure_pct
  device.queue.writeBuffer(metaBuffer, 0, metaData);

  // Cell count
  device.queue.writeBuffer(cellCountBuffer, 0, new Uint32Array([TOTAL_CELLS]));

  // Zero state + log count
  device.queue.writeBuffer(stateBuffer, 0, new Float32Array(CONSERVATION_STATE_SIZE / 4));
  device.queue.writeBuffer(logCountBuffer, 0, new Uint32Array([0]));

  log('Field initialized — phase diagram loaded', 'ok');

  // === SHADER MODULES ===
  const fieldModule = device.createShaderModule({ label: 'field_tensor', code: fieldSrc });
  const conservationModule = device.createShaderModule({ label: 'conservation', code: conservationSrc });
  const sparseModule = device.createShaderModule({ label: 'sparse_stream', code: sparseSrc });

  // === BIND GROUP LAYOUTS ===
  // field_tensor: @group(0) bindings 0-4
  const fieldBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
      { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
      { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
    ]
  });

  // conservation_enforce: @group(0) bindings 0-5
  const conservationBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 5, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
    ]
  });

  // sparse_stream: @group(0) bindings 0-2
  const sparseBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
      { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
    ]
  });

  // === COMPUTE PIPELINES ===
  const fieldPipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [fieldBGL] }),
    compute: { module: fieldModule, entryPoint: 'field_tensor_update' },
  });

  const enforcePipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [conservationBGL] }),
    compute: { module: conservationModule, entryPoint: 'enforce_conservation' },
  });

  const globalPipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [conservationBGL] }),
    compute: { module: conservationModule, entryPoint: 'global_correction_pass_vinculum' },
  });

  // === BIND GROUPS ===
  const fieldBG = device.createBindGroup({
    layout: fieldBGL,
    entries: [
      { binding: 0, resource: { buffer: fieldBuffer } },
      { binding: 1, resource: { buffer: stateBuffer } },
      { binding: 2, resource: { buffer: metaBuffer } },
      { binding: 3, resource: { buffer: phaseBuffer } },
      { binding: 4, resource: { buffer: gradientBuffer } },
    ]
  });

  const conservationBG = device.createBindGroup({
    layout: conservationBGL,
    entries: [
      { binding: 0, resource: { buffer: fieldBuffer } },
      { binding: 1, resource: { buffer: gradientBuffer } },
      { binding: 2, resource: { buffer: stateBuffer } },
      { binding: 3, resource: { buffer: correctionLogBuffer } },
      { binding: 4, resource: { buffer: logCountBuffer } },
      { binding: 5, resource: { buffer: cellCountBuffer } },
    ]
  });

  // Sparse stream bind group (placeholder — not dispatched yet)
  const sparseKeysBuffer = device.createBuffer({
    size: 1024 * 8,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  const sparseCountsBuffer = device.createBuffer({
    size: 1024 * 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  const sparseHeaderBuffer = device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  const sparseBG = device.createBindGroup({
    layout: sparseBGL,
    entries: [
      { binding: 0, resource: { buffer: sparseKeysBuffer } },
      { binding: 1, resource: { buffer: sparseCountsBuffer } },
      { binding: 2, resource: { buffer: sparseHeaderBuffer } },
    ]
  });
  const sparsePipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [sparseBGL] }),
    compute: { module: sparseModule, entryPoint: 'histogram_pass' },
  });

  log('Compute pipelines created — 3 entry points', 'ok');
  // === MT2: Timestamp query set ===
  const TIMESTAMP_SLOTS = 10; // 2 per pass × 5 passes
  const timestampQuerySet = device.createQuerySet({
    type: 'timestamp',
    count: TIMESTAMP_SLOTS,
  });
  const timestampBuffer = device.createBuffer({
    size: TIMESTAMP_SLOTS * 8, // uint64 per timestamp
    usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC,
  });
  const timestampReadBuffer = device.createBuffer({
    size: TIMESTAMP_SLOTS * 8,
    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
  });
  const timestampPeriod = 1_000_000 / (80_000_000); // ~12.5ns on modern GPU, convert to μs


  // === HUD UPDATES ===
  document.getElementById('cellCount').textContent = `${(TOTAL_CELLS / 1000).toFixed(0)}K`;
  document.getElementById('activeCells').textContent = `${(TOTAL_CELLS / 1000).toFixed(0)}K`;

  // === FRAME LOOP ===
  let frame = 0;
  let lastTime = performance.now();
  let fpsAccum = 0;
  let fpsFrames = 0;
  let lastMetricLog = 0;

  const commandEncoder = device.createCommandEncoder;

  async function readbackState() {
    const encoder = device.createCommandEncoder();
    encoder.copyBufferToBuffer(stateBuffer, 0, stagingBuffer, 0, CONSERVATION_STATE_SIZE);
    device.queue.submit([encoder.finish()]);

    await stagingBuffer.mapAsync(GPUMapMode.READ);
    const data = new Float32Array(stagingBuffer.getMappedRange());
    // Layout: [0]=mass_drift, [1]=energy_drift, [4]=momentum.x, [5]=momentum.y, [6]=momentum.z, [7]=total_mass, [8]=total_energy
    const massDrift = data[0];
    const energyDrift = data[1];
    const totalMass = data[7];  // offset 28 / 4 = 7
    const totalEnergy = data[8]; // offset 32 / 4 = 8
    stagingBuffer.unmap();

    return { massDrift, energyDrift, totalMass, totalEnergy };
  }


  // === MT1: Error scope helper ===
  let _errorCheckFrame = 0;
  function pushErrorScopes() {
    device.pushErrorScope('validation');
    device.pushErrorScope('out-of-memory');
  }
  async function popErrorScopes(passName) {
    const oom = await device.popErrorScope();
    const validation = await device.popErrorScope();
    if (validation) log(`GPU VALIDATION [${passName}]: ${validation.message}`, 'err');
    if (oom) log(`GPU OOM [${passName}]: ${oom.message}`, 'err');
  }

  async function readbackCorrections() {
    const readBuf = device.createBuffer({
      size: 4,
      usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
    });
    const encoder = device.createCommandEncoder();
    encoder.copyBufferToBuffer(logCountBuffer, 0, readBuf, 0, 4);
    device.queue.submit([encoder.finish()]);

    await readBuf.mapAsync(GPUMapMode.READ);
    const count = new Uint32Array(readBuf.getMappedRange())[0];
    readBuf.unmap();
    readBuf.destroy();
    return count;
  }

  function frameLoop() {
    requestAnimationFrame(frameLoop);
    frame++;

    // === MT1+MT2: COMPUTE DISPATCH with error scopes + timestamps ===
    const encoder = device.createCommandEncoder();

    // Error scope check every 60 frames
    const checkErrors = (frame % 60 === 0);
    if (checkErrors) pushErrorScopes();

    // 1. Field tensor update
    {
      const pass = encoder.beginComputePass({ timestampWrites: { querySet: timestampQuerySet, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 } });
      pass.setPipeline(fieldPipeline);
      pass.setBindGroup(0, fieldBG);
      pass.dispatchWorkgroups(
        Math.ceil(GRID / 8),
        Math.ceil(GRID / 8),
        GRID
      );
      pass.end();
    }

    // 2. Reset state + log count
    encoder.clearBuffer(stateBuffer, 0, CONSERVATION_STATE_SIZE);
    encoder.clearBuffer(logCountBuffer, 0, 4);

    // 3. Conservation enforce
    {
      const pass = encoder.beginComputePass({ timestampWrites: { querySet: timestampQuerySet, beginningOfPassWriteIndex: 2, endOfPassWriteIndex: 3 } });
      pass.setPipeline(enforcePipeline);
      pass.setBindGroup(0, conservationBG);
      pass.dispatchWorkgroups(Math.ceil(TOTAL_CELLS / 64));
      pass.end();
    }

    // 4. Global correction
    {
      const pass = encoder.beginComputePass({ timestampWrites: { querySet: timestampQuerySet, beginningOfPassWriteIndex: 4, endOfPassWriteIndex: 5 } });
      pass.setPipeline(globalPipeline);
      pass.setBindGroup(0, conservationBG);
      pass.dispatchWorkgroups(1);
      pass.end();
    }

    // 5. Sparse stream histogram
    {
      const pass = encoder.beginComputePass({ timestampWrites: { querySet: timestampQuerySet, beginningOfPassWriteIndex: 6, endOfPassWriteIndex: 7 } });
      pass.setPipeline(sparsePipeline);
      pass.setBindGroup(0, sparseBG);
      pass.dispatchWorkgroups(16);
      pass.end();
    }

    // Resolve timestamps
    encoder.resolveQuerySet(timestampQuerySet, 0, TIMESTAMP_SLOTS, timestampBuffer, 0);
    encoder.copyBufferToBuffer(timestampBuffer, 0, timestampReadBuffer, 0, TIMESTAMP_SLOTS * 8);

    device.queue.submit([encoder.finish()]);

    // Pop error scopes
    if (checkErrors) popErrorScopes('dispatch');

    // === METRICS (every 30 frames to avoid mapAsync backpressure) ===

      // GPU timestamp readback (every 60 frames)
      if (frame % 60 === 0) {
        try {
          await timestampReadBuffer.mapAsync(GPUMapMode.READ);
          const timestamps = new BigInt64Array(timestampReadBuffer.getMappedRange());
          const field_us = Number(timestamps[1] - timestamps[0]) * timestampPeriod;
          const cons_us = Number(timestamps[3] - timestamps[2]) * timestampPeriod;
          const global_us = Number(timestamps[5] - timestamps[4]) * timestampPeriod;
          const total_us = field_us + cons_us + global_us;
          document.getElementById('gpuTime').textContent = `${total_us.toFixed(0)}μs (F:${field_us.toFixed(0)} C:${cons_us.toFixed(0)} G:${global_us.toFixed(0)})`;
          timestampReadBuffer.unmap();
        } catch(e) {
          // Buffer may still be in use from previous read
        }
      }

    if (frame % 30 === 0) {
      // FPS
      const now = performance.now();
      const dt = now - lastTime;
      lastTime = now;
      if (fpsFrames > 0) {
        document.getElementById('fps').textContent = Math.round(1000 / (fpsAccum / fpsFrames));
      }
      fpsAccum = 0;
      fpsFrames = 0;

      // GPU readback (async)
      readbackState().then(s => {
        const driftPct = (Math.abs(s.massDrift) * 100).toFixed(4);
        document.getElementById('massDrift').textContent = driftPct + '%';
        const conserved = Math.abs(s.massDrift) < 1e-4;
        document.getElementById('conservation').textContent = conserved ? 'ENFORCED' : 'BREACH';
        document.getElementById('conservation').style.color = conserved ? '#afa' : '#f66';

        if (now - lastMetricLog > 2000) {
          lastMetricLog = now;
          log(`mass_drift=${driftPct}% total_mass=${s.totalMass.toFixed(4)} energy=${s.totalEnergy.toFixed(2)} ${conserved ? '✓' : '⚠'}`, conserved ? 'metric' : 'warn');
        }
      });

      readbackCorrections().then(count => {
        document.getElementById('corrections').textContent = count;
      });
    } else {
      fpsAccum += performance.now() - lastTime;
      fpsFrames++;
      lastTime = performance.now();
    }
  }

  log('Compute loop started — 3-stage dispatch live', 'ok');
  document.getElementById('conservation').textContent = 'BOOTING';
  requestAnimationFrame(frameLoop);
}

init().catch(e => {
  log(`FATAL: ${e.message}`, 'err');
  console.error(e);
});
</script>
</body>
</html>
