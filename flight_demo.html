<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singular Substrate — Flight Mechanics & Solidifier</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Consolas', monospace; color: #0fa; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 16px; left: 16px; background: rgba(0,0,0,0.8); padding: 12px; border: 1px solid #0fa; font-size: 13px; z-index: 10; pointer-events: none; }
  #hud div { margin-bottom: 4px; }
  .val { color: #fff; font-weight: bold; }
  #prompt { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border: 1px solid #0fa; cursor: pointer; text-align: center; }
  #prompt:hover { background: rgba(0,255,170,0.2); }
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<div id="hud">
  <div>SUBSTRATE FLIGHT DEMO</div>
  <div>Mode: <span id="h-mode" class="val">AETHERION (Builder)</span></div>
  <div>Pos: <span id="h-pos" class="val">0.0, 0.0, 0.0</span></div>
  <div>Ground Y: <span id="h-ground" class="val">--</span></div>
  <div>Speed: <span id="h-speed" class="val">0.0</span></div>
  <div style="margin-top: 10px; color: #888;">[W][A][S][D] Fly &nbsp; [SPACE] Up &nbsp; [SHIFT] Down</div>
  <div style="color: #888;">[TAB] Switch Ship</div>
</div>
<div id="prompt">CLICK TO INITIALIZE SUBSTRATE</div>

<script type="module">
// WebGPU Singular Substrate Engine
// Features: 
// 1. Raymarched terrain with Aetherion (smooth) and Manifold (jagged) biomes
// 2. GPU-to-CPU readback for collision (Solidifier)
// 3. Dual ship flight mechanics

const canvas = document.getElementById('gpu');
let device, context;
let presentationFormat;

// Physics & Camera State
let camPos = [0.0, 20.0, 0.0];
let camVel = [0.0, 0.0, 0.0];
let camDir = [0.0, 0.0, 1.0];
let pitch = 0, yaw = 0;
let keys = {};
let groundHeight = 0.0;

// Ship Types
// 0: Aetherion Builder (Hover, precise, anti-gravity)
// 1: Manifold Fighter (Inertia, fast, gravity-bound)
let shipType = 0; 
let isPointerLocked = false;

// WGSL Shaders
const shaderCode = \`
struct Uniforms {
  camPos: vec3f,
  camDir: vec3f,
  camUp: vec3f,
  camRight: vec3f,
  time: f32,
  resolution: vec2f,
}
@group(0) @binding(0) var<uniform> u: Uniforms;
@group(0) @binding(1) var<storage, read_write> collision_out: array<f32>;

// Hash function
fn hash(p: vec2f) -> f32 {
    let q = vec2f(dot(p, vec2f(127.1, 311.7)), dot(p, vec2f(269.5, 183.3)));
    return fract(sin(q.x) * 43758.5453);
}

fn noise(x: vec2f) -> f32 {
    let p = floor(x);
    let f = fract(x);
    let u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(p + vec2f(0.0,0.0)), hash(p + vec2f(1.0,0.0)), u.x),
               mix(hash(p + vec2f(0.0,1.0)), hash(p + vec2f(1.0,1.0)), u.x), u.y);
}

fn fbm(x: vec2f, octaves: u32) -> f32 {
    var v = 0.0; var a = 0.5;
    var shift = vec2f(100.0);
    var p = x;
    for (var i=0u; i<octaves; i++) {
        v += a * noise(p);
        p = p * 2.0 + shift;
        a *= 0.5;
    }
    return v;
}

// Substrate Field Function
// Evaluates terrain height at a given XZ coordinate
fn getSubstrateHeight(p: vec2f) -> f32 {
    // Biome mixing based on global position
    // Aetherion: Smooth, flat building plateaus
    let aetherion = fbm(p * 0.01, 3u) * 20.0;
    let plateau = floor(aetherion * 0.2) * 5.0 + smoothstep(0.0, 0.1, fract(aetherion * 0.2)) * 5.0;
    
    // Manifold: Jagged, hostile, hyperpoly
    let manifold = fbm(p * 0.05, 6u) * 40.0 + fbm(p * 0.2, 2u) * 5.0;
    
    // Blend map
    let blend = smoothstep(0.3, 0.7, noise(p * 0.002));
    
    return mix(plateau, manifold, blend);
}

// --- COLLISION COMPUTE PASS ---
// Evaluates the terrain height exactly beneath the camera and writes it back to CPU
@compute @workgroup_size(1)
fn compute_collision(@builtin(global_invocation_id) id: vec3u) {
    if (id.x == 0u) {
        let h = getSubstrateHeight(u.camPos.xz);
        collision_out[0] = h;
    }
}

// --- RENDER PASS ---
struct VSOut {
    @builtin(position) pos: vec4f,
    @location(0) uv: vec2f,
}

@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
    var pos = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
    var out: VSOut;
    out.pos = vec4f(pos[vid], 0.0, 1.0);
    out.uv = pos[vid];
    return out;
}

fn getNormal(p: vec3f) -> vec3f {
    let e = vec2f(0.01, 0.0);
    return normalize(vec3f(
        getSubstrateHeight(p.xz + e.xy) - getSubstrateHeight(p.xz - e.xy),
        e.x * 2.0,
        getSubstrateHeight(p.xz + e.yx) - getSubstrateHeight(p.xz - e.yx)
    ));
}

@fragment
fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
    // Camera ray setup
    let ndc = uv;
    let rayDir = normalize(ndc.x * u.camRight + ndc.y * u.camUp + 1.5 * u.camDir);
    
    // Raymarching
    var ro = u.camPos;
    var rd = rayDir;
    var t = 0.0;
    var hit = false;
    var p = vec3f(0.0);
    
    for(var i=0; i<150; i++) {
        p = ro + rd * t;
        let h = getSubstrateHeight(p.xz);
        let dist = p.y - h;
        if(dist < 0.01) { hit = true; break; }
        t += dist * 0.5; // step size
        if(t > 300.0) { break; }
    }
    
    // Shading
    var col = vec3f(0.05, 0.05, 0.08); // sky
    if(hit) {
        let n = getNormal(p);
        let sunDir = normalize(vec3f(0.5, 0.8, -0.2));
        let diff = max(dot(n, sunDir), 0.0);
        
        // Biome coloring based on blend
        let blend = smoothstep(0.3, 0.7, noise(p.xz * 0.002));
        let aetherionCol = vec3f(0.2, 0.6, 0.8); // cyan plateaus
        let manifoldCol = vec3f(0.7, 0.2, 0.1);  // red jagged rocks
        let baseCol = mix(aetherionCol, manifoldCol, blend);
        
        // Grid overlay for Aetherion zones
        var grid = 0.0;
        if (blend < 0.5) {
            let g = fract(p.xz * 0.2);
            if (g.x < 0.05 || g.y < 0.05) { grid = 1.0; }
        }
        
        col = baseCol * (diff * 0.8 + 0.2) + vec3f(0.0, 0.8, 0.8) * grid * 0.5;
        
        // Fog
        col = mix(col, vec3f(0.05, 0.05, 0.08), 1.0 - exp(-0.005 * t));
    }
    
    // --- COCKPIT & HUD OVERLAY (Match generated concept art) ---
    let dist_to_center = length(ndc);
    var hud = vec3f(0.0);
    
    // 1. Circular targeting reticle
    if (abs(dist_to_center - 0.15) < 0.003) {
        hud = vec3f(0.0, 1.0, 0.6);
    }
    if (dist_to_center < 0.005) {
        hud = vec3f(0.0, 1.0, 0.6);
    }
    
    // 2. Horizontal HUD pitch/roll bars
    if (abs(ndc.y) < 0.001 && abs(ndc.x) < 0.1) {
        hud = vec3f(0.0, 1.0, 0.6);
    }
    
    // 3. Vertical altimeter on the right
    if (abs(ndc.x - 0.35) < 0.002 && abs(ndc.y) < 0.2) {
        hud = vec3f(0.0, 1.0, 0.6);
    }
    // Ticks
    if (abs(ndc.x - 0.35) < 0.01 && fract(ndc.y * 10.0) < 0.05 && abs(ndc.y) < 0.2) {
        hud = vec3f(0.0, 1.0, 0.6);
    }
    
    // 4. Vertical speed scale on the left
    if (abs(ndc.x + 0.35) < 0.002 && abs(ndc.y) < 0.2) {
        hud = vec3f(0.0, 1.0, 0.6);
    }
    if (abs(ndc.x + 0.35) < 0.01 && fract(ndc.y * 10.0) < 0.05 && abs(ndc.y) < 0.2) {
        hud = vec3f(0.0, 1.0, 0.6);
    }

    // 5. Cockpit physical struts (dark metal beams)
    var strut = 0.0;
    // Lower console dash
    if (ndc.y < -0.6) {
        strut = 1.0;
    }
    // Diagonal structural support pillars
    if (abs(abs(ndc.x) - 0.7 - (ndc.y * 0.4)) < 0.02) {
        strut = 1.0;
    }
    // Center alignment structural column
    if (abs(ndc.x) < 0.004 && ndc.y < -0.3) {
        strut = 1.0;
    }

    if (strut > 0.0) {
        // Dark carbon fiber metal texture
        let texture_pattern = fract(sin(ndc.x * 300.0) * 10.0);
        col = mix(vec3f(0.07, 0.08, 0.09), vec3f(0.11, 0.13, 0.15), texture_pattern);
        
        // Edge highlighting (blue cockpit LED ambient reflections)
        if (ndc.y > -0.605 || abs(abs(ndc.x) - 0.7 - (ndc.y * 0.4)) > 0.016) {
            col += vec3f(0.05, 0.1, 0.15);
        }
    } else {
        // Merge HUD onto scene
        if (length(hud) > 0.0) {
            col = mix(col, hud, 0.85);
        }
        // Slight cyan glass reflection tint
        col = mix(col, vec3f(0.0, 0.04, 0.06), 0.03);
    }
    
    return vec4f(col, 1.0);
}
\`;

async function initWebGPU() {
    if (!navigator.gpu) throw new Error("WebGPU not supported.");
    const adapter = await navigator.gpu.requestAdapter();
    device = await adapter.requestDevice();
    context = canvas.getContext('webgpu');
    presentationFormat = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format: presentationFormat, alphaMode: 'premultiplied' });

    const module = device.createShaderModule({ code: shaderCode });

    // Buffers
    const uniformBufferSize = 4 * 4 * 6; // camPos(3+1), camDir(3+1), camUp(3+1), camRight(3+1), time(1), res(2), pad(1) -> 16 floats * 4 bytes = 64 bytes
    const uniformBuffer = device.createBuffer({
        size: 64,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const uniformArray = new Float32Array(16);

    // Collision readback buffer (The Solidifier)
    const collisionBuffer = device.createBuffer({
        size: 4,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
    });
    const readbackBuffer = device.createBuffer({
        size: 4,
        usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
    });

    // Pipelines
    const bindGroupLayout = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.FRAGMENT, buffer: { type: "uniform" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }
        ]
    });
    const bindGroup = device.createBindGroup({
        layout: bindGroupLayout,
        entries: [
            { binding: 0, resource: { buffer: uniformBuffer } },
            { binding: 1, resource: { buffer: collisionBuffer } }
        ]
    });

    const computePipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
        compute: { module, entryPoint: "compute_collision" }
    });

    const renderPipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
        vertex: { module, entryPoint: "vs_main" },
        fragment: { module, entryPoint: "fs_main", targets: [{ format: presentationFormat }] },
        primitive: { topology: "triangle-list" }
    });

    // Inputs
    window.addEventListener('keydown', e => {
        if(e.code === 'Tab') {
            e.preventDefault();
            shipType = shipType === 0 ? 1 : 0;
            document.getElementById('h-mode').textContent = shipType === 0 ? "AETHERION (Builder)" : "MANIFOLD (Fighter)";
        }
        keys[e.code] = true;
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    canvas.addEventListener('click', () => {
        canvas.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
        isPointerLocked = document.pointerLockElement === canvas;
    });
    canvas.addEventListener('mousemove', e => {
        if (!isPointerLocked) return;
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-1.5, Math.min(1.5, pitch));
    });

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    let startTime = performance.now();
    let lastTime = startTime;
    let readingCollision = false;

    async function frame() {
        const now = performance.now();
        const dt = (now - lastTime) / 1000.0;
        lastTime = now;

        // Ship Mechanics
        const speed = shipType === 0 ? 30.0 : 80.0; // Builder is precise/slow, Fighter is fast
        const accel = shipType === 0 ? 10.0 : 2.0;  // Builder stops fast, Fighter drifts
        const gravity = shipType === 0 ? 0.0 : 40.0; // Builder hovers, Fighter falls

        const forward = [Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch)];
        const right = [Math.sin(yaw - Math.PI/2), 0, Math.cos(yaw - Math.PI/2)];
        const up = [
            right[1]*forward[2] - right[2]*forward[1],
            right[2]*forward[0] - right[0]*forward[2],
            right[0]*forward[1] - right[1]*forward[0]
        ];

        let moveDir = [0,0,0];
        if(keys['KeyW']) { moveDir[0]+=forward[0]; moveDir[1]+=forward[1]; moveDir[2]+=forward[2]; }
        if(keys['KeyS']) { moveDir[0]-=forward[0]; moveDir[1]-=forward[1]; moveDir[2]-=forward[2]; }
        if(keys['KeyA']) { moveDir[0]+=right[0]; moveDir[1]+=right[1]; moveDir[2]+=right[2]; }
        if(keys['KeyD']) { moveDir[0]-=right[0]; moveDir[1]-=right[1]; moveDir[2]-=right[2]; }
        if(keys['Space']) { moveDir[1] += 1; }
        if(keys['ShiftLeft']) { moveDir[1] -= 1; }

        const len = Math.hypot(moveDir[0], moveDir[1], moveDir[2]);
        if(len > 0) { moveDir = moveDir.map(v => (v/len) * speed); }

        // Apply acceleration (Inertia for Fighter, Snap for Builder)
        camVel[0] += (moveDir[0] - camVel[0]) * accel * dt;
        camVel[1] += (moveDir[1] - camVel[1]) * accel * dt;
        camVel[2] += (moveDir[2] - camVel[2]) * accel * dt;

        if (shipType === 1) {
            camVel[1] -= gravity * dt; // Gravity applies to fighter
        }

        camPos[0] += camVel[0] * dt;
        camPos[1] += camVel[1] * dt;
        camPos[2] += camVel[2] * dt;

        // -------------------------------------------------------------
        // THE SOLIDIFIER (Camera Collision)
        // Ensure camera stays above the ground height read back from GPU
        // -------------------------------------------------------------
        const clearance = shipType === 0 ? 5.0 : 2.0; // Builder hovers higher
        if (camPos[1] < groundHeight + clearance) {
            camPos[1] = groundHeight + clearance;
            if (camVel[1] < 0) camVel[1] = 0; // stop falling
        }

        // Update Uniforms
        uniformArray[0] = camPos[0]; uniformArray[1] = camPos[1]; uniformArray[2] = camPos[2];
        uniformArray[4] = forward[0]; uniformArray[5] = forward[1]; uniformArray[6] = forward[2];
        uniformArray[8] = up[0]; uniformArray[9] = up[1]; uniformArray[10] = up[2];
        uniformArray[12] = right[0]; uniformArray[13] = right[1]; uniformArray[14] = right[2];
        uniformArray[15] = (now - startTime)/1000.0; // time
        // res not used extensively but can be packed

        device.queue.writeBuffer(uniformBuffer, 0, uniformArray);

        // Encode Commands
        const encoder = device.createCommandEncoder();

        // 1. Compute Pass (Collision Solidifier)
        const computePass = encoder.beginComputePass();
        computePass.setPipeline(computePipeline);
        computePass.setBindGroup(0, bindGroup);
        computePass.dispatchWorkgroups(1);
        computePass.end();

        // Copy collision output to readback buffer
        encoder.copyBufferToBuffer(collisionBuffer, 0, readbackBuffer, 0, 4);

        // 2. Render Pass
        const renderPass = encoder.beginRenderPass({
            colorAttachments: [{
                view: context.getCurrentTexture().createView(),
                clearValue: { r:0, g:0, b:0, a:1 },
                loadOp: 'clear',
                storeOp: 'store'
            }]
        });
        renderPass.setPipeline(renderPipeline);
        renderPass.setBindGroup(0, bindGroup);
        renderPass.draw(3);
        renderPass.end();

        device.queue.submit([encoder.finish()]);

        // Async GPU Readback
        if (!readingCollision) {
            readingCollision = true;
            readbackBuffer.mapAsync(GPUMapMode.READ).then(() => {
                const arr = new Float32Array(readbackBuffer.getMappedRange());
                groundHeight = arr[0];
                readbackBuffer.unmap();
                readingCollision = false;
            });
        }

        // Update HUD
        document.getElementById('h-pos').textContent = \`\${camPos[0].toFixed(1)}, \${camPos[1].toFixed(1)}, \${camPos[2].toFixed(1)}\`;
        document.getElementById('h-ground').textContent = groundHeight.toFixed(1);
        const curSpeed = Math.hypot(camVel[0], camVel[1], camVel[2]);
        document.getElementById('h-speed').textContent = curSpeed.toFixed(1);

        requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
}

document.getElementById('prompt').addEventListener('click', () => {
    document.getElementById('prompt').style.display = 'none';
    initWebGPU().catch(e => console.error(e));
});
</script>
</body>
</html>
